```html
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عمر الذهب | Omer Gold</title>
<style>
:root{--bg:#101317;--card:#191e24;--line:#2a3038;--gold:#e8bd62;--text:#f5f1e8;--muted:#a8adb5;--green:#45c486;--red:#ff6671}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:21px;font-weight:800;color:var(--gold)}
.actions{display:flex;gap:8px}
button,select,input{font:inherit}
button,select{border:1px solid var(--line);border-radius:10px;background:#222830;color:var(--text);padding:9px 12px}
button{cursor:pointer}
button:hover{border-color:var(--gold)}
main{max-width:900px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.muted,.note{color:var(--muted);font-size:13px}
.price{font-size:clamp(34px,9vw,56px);font-weight:800;margin:12px 0 2px}
.change{font-weight:700}
.green{color:var(--green)}.red{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{padding:13px;border:1px solid var(--line);border-radius:12px}
.tile b{display:block;font-size:20px;margin-top:7px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#chart{width:100%;height:120px;margin-top:10px}
.forecast{line-height:1.8}
details summary{cursor:pointer;color:var(--gold);font-weight:700}
label{display:block;margin:12px 0 5px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#11161b;color:var(--text)}
.settings{margin-top:12px}
.status{font-size:13px;color:var(--muted);margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:12px 16px 25px}
@media(max-width:520px){header{align-items:flex-start}.card{padding:14px}}
</style>
</head>
<body>
<header>
  <div class="brand">✦ <span data-ar="عمر الذهب" data-en="Omer Gold">عمر الذهب</span></div>
  <div class="actions">
    <button id="langBtn">English</button>
    <button onclick="document.querySelector('#settings').open=true" data-ar="الإعدادات" data-en="Settings">الإعدادات</button>
  </div>
</header>

<main>
  <section class="card">
    <div class="topline">
      <h1 data-ar="سعر الذهب الفوري" data-en="Live Gold Price">سعر الذهب الفوري</h1>
